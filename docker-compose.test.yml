# Test stack: the core platform plus the scriptable Ollama stub that the backend suite controls.
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d \
#     postgres mock-integrations enrichment-service ollama-stub ingestion-service
#   npm run test:backend
#
# The stub is not a model: tests script its replies through /__scenario.

services:
  ollama-stub:
    image: node:24-alpine
    container_name: orchestrator-ollama-stub
    command: ['node', '/stub/ollama-demo-stub.mjs']
    volumes:
      - ./scripts/ollama-demo-stub.mjs:/stub/ollama-demo-stub.mjs:ro
    ports:
      - '11434:11434'
    environment:
      PORT: '11434'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:11434/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
