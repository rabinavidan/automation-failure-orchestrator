id: brute-force-response
version: 1
description: Contain an external brute-force / password-spraying source confirmed by threat intel.
owner: secops-ir
trigger:
  dispositions: [true_positive]
  techniques: [T1110]
steps:
  - id: open-case
    action: ticket.create
    description: Open an incident ticket correlated by alert fingerprint
    approval: none
  - id: notify-soc
    action: slack.notify
    description: Page the SOC channel with triage evidence
    approval: none
  - id: block-source-ip
    action: firewall.block_ip
    description: Block the attacking source IP at the edge firewall (runbook credential-brute-force.md)
    target: { indicator: ip, role: source }
    approval: required
