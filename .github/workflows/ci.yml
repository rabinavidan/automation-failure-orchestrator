name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and agent evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run quality

  python-quality:
    name: Python enrichment service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/enrichment-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/enrichment-service/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  terraform:
    name: Terraform validate and IaC security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Checkov IaC security scan (fails on any unskipped finding)
        run: |
          pip install --quiet checkov==3.3.22
          checkov -d . --framework terraform --quiet --compact

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  production-dependencies:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  container-smoke:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [quality, python-quality]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start core platform
        run: docker compose up -d --build postgres mock-integrations enrichment-service ingestion-service dashboard
        env:
          AI_ENABLED: 'false'
          RAG_ENABLED: 'false'
      - name: Run API, proxy, action, and idempotency smoke checks
        run: npm run test:smoke
      - name: Capture container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Stop platform
        if: always()
        run: docker compose down --volumes

  aws-local-demo:
    name: Zero-cost AWS demo (SQS worker on moto)
    runs-on: ubuntu-latest
    needs: [quality, python-quality]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Start platform with the aws-local override (no AWS account, no cost)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.aws-local.yml up -d --build \
            postgres mock-integrations enrichment-service moto aws-init ollama-stub \
            ingestion-service investigation-worker
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health > /dev/null && break
            sleep 3
          done
      - name: API -> SQS -> investigation worker -> persisted result
        run: npm run demo:aws-local
      - name: Capture container diagnostics
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.aws-local.yml logs --no-color --tail=200
      - name: Stop platform
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.aws-local.yml down --volumes

  shuffle-soar:
    name: Shuffle SOAR playbook (open source, self-hosted)
    runs-on: ubuntu-latest
    needs: [quality, python-quality]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Start orchestrator + Shuffle (backend, orborus, OpenSearch)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.shuffle.yml up -d --build \
            postgres mock-integrations enrichment-service ingestion-service \
            shuffle-opensearch shuffle-backend shuffle-orborus
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/health > /dev/null && break
            sleep 3
          done
      - name: Import the SOC playbook through Shuffle's REST API
        run: npm run shuffle:setup
      - name: Execute the playbook with a Splunk alert and assert every step
        run: npm run shuffle:run
      - name: Capture diagnostics
        if: failure()
        run: |
          docker ps -a
          docker compose -f docker-compose.yml -f docker-compose.shuffle.yml logs --no-color --tail=150 \
            shuffle-backend shuffle-orborus ingestion-service
          for c in $(docker ps -a --format '{{.Names}}' | grep -E '^worker-|http' ); do
            echo "=== $c"; docker logs --tail=80 "$c" 2>&1 || true
          done
      - name: Stop
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.shuffle.yml down --volumes

  image-security:
    name: Runtime image security
    runs-on: ubuntu-latest
    needs: [quality, python-quality]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build runtime images
        run: |
          docker build -f apps/ingestion-service/Dockerfile -t orchestrator-ingestion:ci .
          docker build -f apps/dashboard/Dockerfile -t orchestrator-dashboard:ci .
          docker build -t orchestrator-enrichment:ci apps/enrichment-service
      - name: Scan ingestion image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: orchestrator-ingestion:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
      - name: Scan dashboard image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: orchestrator-dashboard:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
      - name: Scan enrichment image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: orchestrator-enrichment:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  playwright-smoke:
    name: Playwright smoke contract
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/test-suite
      - name: Start deterministic smoke dependency
        run: docker compose up -d --build --wait mock-integrations
      - run: npx playwright test --grep @smoke
        working-directory: apps/test-suite
        env:
          CI: 'true'
          BASE_URL: http://localhost:3002
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-smoke-report
          path: apps/test-suite/playwright-report/
          retention-days: 14

  notify-n8n:
    name: Optional n8n delivery
    runs-on: ubuntu-latest
    needs: [container-smoke, playwright-smoke, aws-local-demo]
    if: always()
    steps:
      - name: Send CI quality result
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "N8N_WEBHOOK_URL is not configured; skipping optional delivery."
            exit 0
          fi
          payload=$(jq -n \
            --arg runId "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg branch "${GITHUB_REF_NAME}" \
            --arg commitSha "${GITHUB_SHA}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:"1.0.0",runId:$runId,repository:$repository,branch:$branch,commitSha:$commitSha,environment:"ci",triggeredBy:"github-actions",startedAt:$timestamp,finishedAt:$timestamp,summary:{total:0,passed:0,failed:0,skipped:0},tests:[]}')
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "$payload"
