name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and agent evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run quality

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  production-dependencies:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  container-smoke:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start core platform
        run: docker compose up -d --build postgres mock-integrations ingestion-service dashboard
        env:
          AI_ENABLED: 'false'
          RAG_ENABLED: 'false'
      - name: Run API, proxy, action, and idempotency smoke checks
        run: npm run test:smoke
      - name: Capture container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Stop platform
        if: always()
        run: docker compose down --volumes

  image-security:
    name: Runtime image security
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime images
        run: |
          docker build -f apps/ingestion-service/Dockerfile -t orchestrator-ingestion:ci .
          docker build -f apps/dashboard/Dockerfile -t orchestrator-dashboard:ci .
      - name: Scan ingestion image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: orchestrator-ingestion:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL
      - name: Scan dashboard image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: orchestrator-dashboard:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL

  playwright-smoke:
    name: Playwright smoke contract
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/test-suite
      - name: Start deterministic smoke dependency
        run: docker compose up -d --build --wait mock-integrations
      - run: npx playwright test --grep @smoke
        working-directory: apps/test-suite
        env:
          CI: 'true'
          BASE_URL: http://localhost:3002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-smoke-report
          path: apps/test-suite/playwright-report/
          retention-days: 14

  notify-n8n:
    name: Optional n8n delivery
    runs-on: ubuntu-latest
    needs: [container-smoke, playwright-smoke]
    if: always()
    steps:
      - name: Send CI quality result
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ -z "$N8N_WEBHOOK_URL" ]; then
            echo "N8N_WEBHOOK_URL is not configured; skipping optional delivery."
            exit 0
          fi
          payload=$(jq -n \
            --arg runId "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg branch "${GITHUB_REF_NAME}" \
            --arg commitSha "${GITHUB_SHA}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:"1.0.0",runId:$runId,repository:$repository,branch:$branch,commitSha:$commitSha,environment:"ci",triggeredBy:"github-actions",startedAt:$timestamp,finishedAt:$timestamp,summary:{total:0,passed:0,failed:0,skipped:0},tests:[]}')
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$N8N_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" \
            -d "$payload"
